[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "duosida-local"
version = "0.1.0a1"
description = "Async local-only client for verified Duosida EV chargers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Matias Kunin" }]
keywords = ["duosida", "evse", "ev-charger", "home-assistant", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/matiaskunin/duosida-local"
Documentation = "https://github.com/matiaskunin/duosida-local#readme"
Issues = "https://github.com/matiaskunin/duosida-local/issues"
Source = "https://github.com/matiaskunin/duosida-local"

[tool.hatch.build.targets.wheel]
packages = ["src/duosida_local"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]
ignore = ["ASYNC109", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=duosida_local --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["duosida_local"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "prek==0.2.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]
